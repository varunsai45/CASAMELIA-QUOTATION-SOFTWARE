services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casamelia}
      POSTGRES_DB: ${POSTGRES_DB:-casamelia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-casamelia}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-casamelia}
      APP_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      SALES_PASSWORD: ${SALES_PASSWORD:?Set SALES_PASSWORD}
      SESSION_HOURS: ${SESSION_HOURS:-8}
    command: [sh, -c, 'python -m alembic upgrade head && python -m backend.app.cli init']
    depends_on:
      db:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_URL: http://backend:8000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
